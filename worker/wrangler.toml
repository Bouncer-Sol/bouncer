name = "bouncer-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Create with `npx wrangler d1 create bouncer` and paste the database_id here.
[[d1_databases]]
binding = "DB"
database_name = "bouncer"
database_id = "34fceb4f-3d33-4b31-b37e-2b5ad1a2fe2e"

[vars]
# $BOUNCER mint after launch. Empty = keys not on sale yet (free tier still works).
TOKEN_ADDRESS = ""
TOKEN_DECIMALS = "6"
# $BOUNCER burned per KEY_DAYS days of an API key.
KEY_PRICE = "100000"
KEY_DAYS = "30"
FREE_PER_DAY = "30"
KEY_PER_DAY = "20000"
# Public site, used in links returned by the API.
SITE_URL = "https://bouncersol.fun"
# Secret (not here): SOL_RPC_URL = your Helius (or other) mainnet RPC url, set with `npx wrangler secret put SOL_RPC_URL`
